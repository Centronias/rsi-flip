[package]
name = "rsi-flip"
description = "CLI tools for working with RSI spritesheets"
version = "2.0.1"
authors = ["Charles Santos (\"Centronias\") <me@centronias.com>"]
edition = "2024"
repository = "https://github.com/Centronias/rsi-flip"
license = "MIT"
publish = false

[package.metadata.dist]
dist = true

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
extend = "1.2.0"
image = "0.25.10"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
rstest = "~0.26"
