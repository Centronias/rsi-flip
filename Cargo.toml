[package]
name = "rsi-flip"
version = "1.2.0"
edition = "2024"
repository = "https://github.com/Centronias/rsi-flip"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
extend = "1.2.0"
image = "0.25.10"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
rstest = "~0.26"
